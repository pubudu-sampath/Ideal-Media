<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EYEDEAL MEDIA</title>
<style>
html{color-scheme:light}:root{--bg:#F7F3EB;--s:#F7F3EB;--ink:#1B1D1F;--mu:#5b5e62;--ln:#d9d3c6;--ac:#D71920;--aci:#F7F3EB;--acx:#D71920;--hl:#D71920;--hli:#F7F3EB;--ph:#ece7db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:80px}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.55}
a{color:inherit;text-decoration:none}
.w{max-width:1160px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
header.top .w{display:flex;align-items:center;gap:18px;height:64px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;margin-right:auto}
.tw{position:relative;max-width:480px;margin:0 auto}.team{display:block;width:100%;height:auto}.hp{position:absolute;border-radius:5%;cursor:zoom-in;outline:none;transition:transform .25s ease,box-shadow .25s ease;transform-origin:var(--o)}.hp img{width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0;transition:opacity .2s;display:block}.hp:hover,.hp:focus{transform:scale(1.7);z-index:5;box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 4px #F7F3EB}.hp:hover img,.hp:focus img{opacity:1}.yr{display:flex;gap:20px;align-items:center;margin-top:28px}.five{flex:none;width:112px;height:112px;border:2px solid var(--ac);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.6rem;font-weight:700;color:var(--ac);position:relative}.five::after{content:"";position:absolute;top:2px;right:6px;width:14px;height:14px;background:var(--ac);border-radius:50%}.yr p{margin:4px 0 0;color:var(--mu);font-size:.93rem}@media(prefers-reduced-motion:reduce){.hp{transition:none}}.lgo{display:block;height:52px;width:auto;max-width:100%}.lg{min-height:0;width:150px;height:40px;padding:0;font-size:.8rem}.logo i{display:inline-block;width:12px;height:12px;background:var(--hl);border-radius:50%;margin-right:6px}
nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:.95rem}
nav a.on{border-bottom:2px solid var(--acx)}
.btn{display:inline-block;background:var(--ac);color:var(--aci);padding:10px 20px;border-radius:2px;font-weight:600;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:2px solid var(--ink);padding:8px 18px}
.dd{position:relative}.dd div{display:none;position:absolute;top:100%;left:-12px;background:var(--s);border:1px solid var(--ln);border-radius:2px;padding:8px;min-width:250px}
.dd:hover div,.dd:focus-within div{display:block}.dd div a{display:block;padding:6px 10px;font-size:.9rem}.dd div a:hover{background:var(--bg)}
.ph{background:repeating-linear-gradient(45deg,var(--ph),var(--ph) 10px,transparent 10px,transparent 20px),var(--s);border:1px dashed var(--mu);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:.85rem;text-align:center;padding:8px;min-height:160px}
.hero{padding:72px 0 56px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;margin:0 0 20px;font-weight:700;letter-spacing:-.03em}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.1;margin:0 0 14px;font-weight:700;letter-spacing:-.02em}
h3{margin:0 0 6px;font-size:1.1rem}
.lede{font-size:1.15rem;color:var(--mu);max-width:56ch;margin:0 0 26px}
.row{display:flex;gap:12px;flex-wrap:wrap}
section.s{padding:56px 0;border-top:1px solid var(--ln)}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--s);border:1px solid var(--ln);border-radius:2px;padding:20px;display:block}
.card.l:hover{border-color:var(--acx)}
.card p{margin:0;color:var(--mu);font-size:.93rem}
.tag{text-transform:uppercase;letter-spacing:.05em;display:inline-block;background:var(--hl);color:var(--hli);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:3px;margin:0 4px 6px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;counter-reset:n}
.steps div{padding:18px;border-left:2px solid var(--acx);counter-increment:n}
.steps div::before{content:counter(n,decimal-leading-zero);font-weight:700;color:var(--acx);display:block}
.steps b{display:block}.steps span{font-size:.9rem;color:var(--mu)}
.band{background:var(--ink);color:var(--bg);padding:56px 0;text-align:center}
.band h2{margin-bottom:18px}.band .btn{background:var(--hl);color:var(--hli)}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.logos .ph{min-height:84px}
ul.k{padding-left:1.1em;margin:0}ul.k li{padding:3px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.cols3{columns:2;column-gap:32px}
.ph-hero{min-height:280px}
.pg{padding:56px 0 24px}.pg .lede{margin-bottom:0}
.crumb{font-size:.88rem;color:var(--mu);margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.flow span{background:var(--s);border:1px solid var(--ln);padding:4px 12px;border-radius:2px;font-size:.85rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.chips button{font:inherit;font-size:.88rem;border:1px solid var(--ln);background:var(--s);color:var(--ink);padding:5px 14px;border-radius:2px;cursor:pointer}.chips button.on{background:var(--ink);color:var(--bg)}
form{display:grid;gap:12px}input,select,textarea{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:2px;background:var(--s);color:var(--ink);width:100%}
footer{background:var(--s);border-top:1px solid var(--ln);padding:40px 0;font-size:.92rem;color:var(--mu)}
footer .g{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}footer b{color:var(--ink);display:block;margin-bottom:6px}footer a{display:block;padding:2px 0}

html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
section[id]{scroll-margin-top:72px}
nav a.on{border-bottom:2px solid var(--acx)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.tabs button{font:inherit;font-size:.92rem;border:1px solid var(--ln);background:var(--s);color:var(--ink);padding:8px 16px;border-radius:2px;cursor:pointer}.tabs button.on{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.rel{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.rel button{font:inherit;font-size:.88rem;border:1px solid var(--acx);background:none;color:var(--acx);padding:5px 14px;border-radius:2px;cursor:pointer}
dialog{border:1px solid var(--ln);border-radius:2px;background:var(--bg);color:var(--ink);width:min(960px,94vw);max-height:90vh;padding:0}dialog::backdrop{background:rgba(10,15,30,.6)}
dialog .in{padding:28px}dialog .x{float:right}
button.card{text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer}
#home .ph{position:relative;overflow:visible}#home .ph::after{content:"";position:absolute;top:-18px;right:-18px;width:84px;height:84px;border:2px solid var(--ac);border-radius:50%;pointer-events:none}.tl{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--acx);margin:0 0 14px}@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.cols3{columns:1}nav{gap:12px;font-size:.88rem}.dd div{display:none!important}}
</style>
</head>

<h3 style="margin:40px 0 14px">What sets us apart</h3><div class="g">${[["Integrated capabilities","ATL, BTL, digital, production and events coordinated as one."],["Hands-on execution","Real campaigns, field teams and on-ground operations."],["Islandwide reach","Festival, roadshow and multi-location activations."],["Media & production strength","From commercials to media buying and placement."],["Flexible delivery","Structured around the scale and goals of each brief."]].map(box).join('')}</div>
<h3 style="margin:40px 0 14px">Our brand philosophy: Create. Craft. Connect.</h3><div class="g">${[["Create","Ideas built around real objectives. We explore the challenge, understand the audience and develop relevant creative and strategic directions."],["Craft","Thoughtful work, carefully delivered. We turn concepts into communication, content, campaigns and experiences through planning and precise execution."],["Connect","Meaningful audience engagement. We bring brands and people together through relevant media, memorable interactions and consistent communication."]].map(box).join('')}</div></div></section>
<section id="approach" class="s"><div class="w"><h2>Our approach</h2><p class="lede">Every project starts with the client’s objectives, audience and requirements. We then combine the right ATL, BTL, digital and experiential solutions into one coordinated campaign.</p><div class="steps">${P.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>
<div class="g" style="margin-top:32px">${[["ATL","Generate awareness through mass media."],["Digital","Extend the conversation before, during and after."],["BTL","Create participation through activations and demonstrations."],["Experiences","Build connections with customers and stakeholders."]].map(box).join('')}</div></div></section>
<section id="services" class="s"><div class="w"><h2>Our services</h2><p class="lede">Seven integrated services, one accountable team.</p><div class="tabs" id="tabs">${S.map((s,i)=>`<button data-s="${s[0]}" class="${i?'':'on'}">${s[1]}</button>`).join('')}</div><div id="sv">${sv('atl')}</div></div></section>
<section id="work" class="s"><div class="w"><h2>Our work</h2><p class="lede">Real campaigns, delivered on the ground and on air. Select a project for details.</p><div class="chips" id="chips">${['All','ATL','BTL','Digital','Creative','Outdoor'].map((t,i)=>`<button class="${i?'':'on'}">${t}</button>`).join('')}</div><div class="g" id="wg">${C.map(cc).join('')}</div></div></section>
<section id="clients" class="s"><div class="w"><h2>Our clients</h2><p class="lede">We have delivered and supported marketing, advertising and event projects for brands with different audiences, requirements and commercial objectives. We value the trust placed in us and approach every project according to its unique requirements.</p>${logos}</div></section>
<section id="contact" class="band" style="text-align:left;background:var(--ac);color:var(--aci)"><div class="w two"><div><h2>Let’s build something together</h2><p>Tell us about your brief.</p><p>[Address]<br>[Phone]<br>[Email]</p></div><form onsubmit="event.preventDefault();this.innerHTML='<h3>Thank you. We will be in touch.</h3>'"><input placeholder="Name" required><input placeholder="Company"><input type="email" placeholder="Email" required><input placeholder="Phone"><select><option>Service of interest</option>${S.map(s=>`<option>${s[1]}</option>`).join('')}</select><textarea rows="4" placeholder="Message"></textarea><button class="btn" style="background:#1B1D1F;color:#F7F3EB">Send enquiry</button></form></div></section>`;
const dlg=$('#dlg'),open=id=>{dlg.innerHTML=cse(id);dlg.showModal()};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(e.target===dlg||(t&&t.dataset.x!==undefined))return dlg.close();if(!t)return;
if(t.dataset.c)open(t.dataset.c);
if(t.dataset.s){[...$('#tabs').children].forEach(b=>b.classList.toggle('on',b==t));$('#sv').innerHTML=sv(t.dataset.s)}
if(t.parentElement.id=='chips'){[...t.parentElement.children].forEach(b=>b.classList.toggle('on',b==t));const k=t.textContent;$('#wg').innerHTML=C.filter(c=>k=='All'||c[3].includes(k)).map(cc).join('')}});
const links=[...document.querySelectorAll('#nav a:not(.btn)')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.hash=='#'+e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});document.querySelectorAll('section[id]').forEach(s=>io.observe(s));
</script>
